<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foto Bisa Bicara AI</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎤 Foto Bisa Bicara AI</h1>
            <p>Buat foto berbicara mengikuti audio</p>
        </header>

        <main>

            <!-- PILIH FOTO -->
            <div class="card">

                <h2>1. Pilih Foto</h2>

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                >

                <div id="photoPreview" class="preview">
                    <span>Belum ada foto</span>
                </div>

            </div>


            <!-- PILIH AUDIO -->
            <div class="card">

                <h2>2. Pilih Audio</h2>

                <input
                    type="file"
                    id="audioInput"
                    accept="audio/*"
                >

                <div id="audioName">
                    Belum ada audio
                </div>

                <audio
                    id="audioPreview"
                    controls
                    style="display:none;">
                </audio>

            </div>


            <!-- TOMBOL PROSES -->
            <div class="card">

                <button
                    id="generateButton"
                    type="button">

                    🎬 Buat Foto Berbicara

                </button>

                <div
                    id="status"
                    class="status">
                </div>

            </div>


            <!-- HASIL -->
            <div
                id="resultCard"
                class="card"
                style="display:none;">

                <h2>3. Hasil Video</h2>

                <video
                    id="resultVideo"
                    controls
                    playsinline>
                </video>

                <br>

                <a
                    id="downloadButton"
                    class="download"
                    download="foto-berbicara.mp4">

                    ⬇️ Simpan Video

                </a>

            </div>

        </main>

        <footer>
            <p>Foto Bisa Bicara AI</p>
        </footer>

    </div>


    <script src="/static/script.js"></script>

</body>
</html>
